# Mango config for greetd greeter

# Output mode
monitor_rule=name:^Virtual-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,rr:0,vrr:0

# Greeter window
border_px=0
window_rule=is_fullscreen:1,title:^greeter$

# Start the greeter
exec_once=sh -c 'env QT_WAYLAND_DISABLE_WINDOWDECORATION=1 quickshell -p /etc/greetd/quickshell/greeter.qml; pkill -x mango'
