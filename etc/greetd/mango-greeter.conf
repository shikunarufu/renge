# Autostart
exec_once=bash /etc/greetd/greeter/start.sh

# Monitor Rules
monitor_rule=model:AOC,model:24G4,width:1920,height:1080,refresh:180,x:0,y:0
monitor_rule=model:QEMU Monitor,width:1920,height:1080,refresh:60,x:0,y:0

# Borders
root_color=0x000000ff

# Cursor
cursor_size=16
cursor_theme=Bibata-Modern-Ice
