#######################################
# Layouts
#######################################

# Scroller
scroller_structs=14
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0

# Master-Stack
new_is_master=1
default_master_factor=0.55
default_master_count=1
center_master_overspread=0
center_when_single_stack=1

# Dwindle
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0
dwindle_smart_resize=0
dwindle_drop_simple_split=1
dwindle_manual_split=0

#######################################
# Rules
#######################################

# Window
window_rule=is_floating:1,app_id:thunar,title:.*Confirm.*
window_rule=is_floating:1,app_id:thunar,title:.*Progress.*
window_rule=is_floating:1,is_global:1,no_border:1,width:480,height:270,offset_x:99,offset_y:99,title:Picture-in-Picture

# Tag
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Layer
layer_rule=animation_type_open:zoom,layer_name:app-launcher
layer_rule=animation_type_close:zoom,layer_name:app-launcher
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
layer_rule=no_animation:1,layer_name:notifications

#######################################
# Overview
#######################################

hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
hotarea_corner=2
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
jump_labels=HJKLASDFGQWERTYUIOPZXCVBNM

#######################################
# Scratchpad
#######################################

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
