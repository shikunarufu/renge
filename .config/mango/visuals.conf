#######################################
# Theming
#######################################

# Dimensions
border_px=0
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=14
gap_outer_vertical=14

# State-Specific Colors
maximized_screen_color=0x89aa61ff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Overview Jump Mode
jump_label_decorate_fg_color=0xc4939dff
jump_label_decorate_bg_color=0x201b14ff
jump_label_decorate_focus_fg_color=0x201b14ff
jump_label_decorate_focus_bg_color=0xc4939dff
jump_label_decorate_border_color=0x8BAA9Bff
jump_label_decorate_border_width=4
jump_label_decorate_corner_radius=5
jump_label_decorate_padding_x=10
jump_label_decorate_padding_y=10
jump_label_decorate_font_desc=monospace Bold 16

# Tab Bar For Monocle Layout
group_bar_height=50
group_bar_decorate_fg_color=0xc4939dff
group_bar_decorate_bg_color=0x201b14ff
group_bar_decorate_focus_fg_color=0x201b14ff
group_bar_decorate_focus_bg_color=0xc4939dff
group_bar_decorate_border_color=0x8BAA9Bff
group_bar_decorate_border_width=4
group_bar_decorate_corner_radius=5
group_bar_decorate_padding_x=0
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=monospace Bold 16

# Borders
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
urgent_color=0xad401fff

# Cursor
cursor_size=16
cursor_theme=Bibata-Modern-Ice

#######################################
# Window Effects
#######################################

# Blur
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius = 8
blur_params_num_passes = 2
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 14
shadows_blur = 28
shadows_position_x = -14
shadows_position_y = -14
shadows_color= 0x000000ff

# Opacity & Corner Radius
border_radius=4
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.95

# Dim Overlay
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0000000D

#######################################
# Animations
#######################################

# Enabling Animations
animations=1
layer_animations=1

# Animation Types
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0
fade_out_begin_opacity=1

# Zoom
zoom_initial_ratio=0.95
zoom_end_ratio=0.95

# Durations
animation_duration_move=500
animation_duration_open=500
animation_duration_tag=350
animation_duration_close=500
animation_duration_focus=0

# Bezier Curves
animation_curve_open=0.83,0,0.17,1
animation_curve_move=0.83,0,0.17,1
animation_curve_tag=0.83,0,0.17,1
animation_curve_close=0.83,0,0.17,1
animation_curve_focus=0.83,0,0.17,1
animation_curve_opacity_fade_in=0.83,0,0.17,1
animation_curve_opacity_fade_out=0.83,0,0.17,1

# Tag Animation Direction
tag_animation_direction=1
