#######################################
# Theming
#######################################

# Dimensions
borderpx=4
gappih=5
gappiv=5
gappoh=10
gappov=10

# State-Specific Colors
maximizescreencolor=0x89aa61ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# Overview Jump Mode
jump_label_decorate_fg_color=0xc4939dff
jump_label_decorate_bg_color=0x201b14ff
jump_label_decorate_focus_fg_color=0x201b14ff
jump_label_decorate_focus_bg_color=0xc4939dff
jump_label_decorate_border_color=0x8BAA9Bff
jump_label_decorate_border_width=4
jump_label_decorate_corner_radius=5
jump_label_decorate_padding_x=10
jump_label_decorate_padding_y=10
jump_label_decorate_font_desc=monospace Bold 16

# Tab Bar For Monocle Layout
group_bar_height=50
group_bar_decorate_fg_color=0xc4939dff
group_bar_decorate_bg_color=0x201b14ff
group_bar_decorate_focus_fg_color=0x201b14ff
group_bar_decorate_focus_bg_color=0xc4939dff
group_bar_decorate_border_color=0x8BAA9Bff
group_bar_decorate_border_width=4
group_bar_decorate_corner_radius=5
group_bar_decorate_padding_x=0
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=monospace Bold 16

# Borders
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
urgentcolor=0xad401fff

# Cursor
cursor_size=24
cursor_theme=Adwaita

#######################################
# Window Effects
#######################################

# Blur
blur=0
blur_layer=0
blur_optimized=1
blur_params_radius = 5
blur_params_num_passes = 2
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Opacity & Corner Radius
border_radius=6
border_radius_location_default=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Dim Overlay
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

#######################################
# Animations
#######################################

# Enabling Animations
animations=1
layer_animations=1

# Animation Types
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

# Zoom
zoom_initial_ratio=0.4
zoom_end_ratio=0.8

# Durations
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0

# Bezier Curves
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# Tag Animation Direction
tag_animation_direction=1
