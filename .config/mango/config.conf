# mangowm configuration file

#######################################
# Environment Variables
#######################################

# Fcitx5
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

#######################################
# Autostart
#######################################

# Screen Sharing
exec-once=/usr/lib/xdg-desktop-portal-wlr &

# Clipboard Manager
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec-once=wl-paste --type text --watch cliphist store &

#######################################
# Monitors
#######################################

# Monitor Rules
monitorrule=model:QEMU Monitor,width:1920,height:1080,refresh:60,x:0,y:0

# Tearing
allow_tearing=1

#######################################
# Input Devices
#######################################

# Keyboard Settings
repeat_rate=50
repeat_delay=200
numlockon=0
xkb_rules_layout=us

# Mouse Settings
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0.0
mouse_left_handed=0
mouse_middle_button_emulation=0
mouse_scroll_method=1
mouse_scroll_button=274
mouse_click_method=1
mouse_send_events_mode=0
axis_scroll_factor=1.0

# Trackpad Settings
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=0
trackpad_accel_profile=2
trackpad_accel_speed=0.0
trackpad_scroll_button=274
trackpad_scroll_method=1
trackpad_click_method=1
trackpad_send_events_mode=0
drag_lock=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
gesture_live=1
gesture_swipe_distance=300
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=10
button_map=0
trackpad_scroll_factor=1.0

# Touchscreen Settings
touch_enable=0
touch_enable_mouse_emulation=0

#######################################
# Miscellaneous
#######################################

# System & Hardware
xwayland_persistence=1
xwayland_ignore_scale=0
syncobj_enable=1
allow_lock_transparent=0
allow_shortcuts_inhibit=1

# Focus & Input
focus_on_activate=1
sloppyfocus=1
warpcursor=1
cursor_hide_timeout=0
cursor_hide_on_keypress=1
drag_tile_to_tile=1
drag_tile_small=1
drag_corner=3
drag_warp_cursor=1
axis_bind_apply_timeout=100

# Multi-Monitor & Tags
focus_cross_monitor=0
focusdir_only_zone_overlap=1
exchange_cross_monitor=0
focus_cross_tag=0
view_current_to_back=0
scratchpad_cross_monitor=0
single_scratchpad=1
tag_num=9
tag_gather=0

# Window Behavior
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
no_border_when_single=0
smartgaps=0
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
tag_carousel=0
drag_tile_refresh_interval=8.0
drag_floating_refresh_interval=8.0

#######################################
# Theming
#######################################

# Dimensions
borderpx=4
gappih=5
gappiv=5
gappoh=10
gappov=10

# State-Specific Colors
maximizescreencolor=0x89aa61ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# Overview Jump Mode
jump_label_decorate_fg_color=0xc4939dff
jump_label_decorate_bg_color=0x201b14ff
jump_label_decorate_focus_fg_color=0x201b14ff
jump_label_decorate_focus_bg_color=0xc4939dff
jump_label_decorate_border_color=0x8BAA9Bff
jump_label_decorate_border_width=4
jump_label_decorate_corner_radius=5
jump_label_decorate_padding_x=10
jump_label_decorate_padding_y=10
jump_label_decorate_font_desc=monospace Bold 16

# Tab Bar For Monocle Layout
group_bar_height=50
group_bar_decorate_fg_color=0xc4939dff
group_bar_decorate_bg_color=0x201b14ff
group_bar_decorate_focus_fg_color=0x201b14ff
group_bar_decorate_focus_bg_color=0xc4939dff
group_bar_decorate_border_color=0x8BAA9Bff
group_bar_decorate_border_width=4
group_bar_decorate_corner_radius=5
group_bar_decorate_padding_x=0
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=monospace Bold 16

# Borders
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
urgentcolor=0xad401fff

# Cursor
cursor_size=24
cursor_theme=Adwaita

#######################################
# Window Effects
#######################################

# Blur
blur=0
blur_layer=0
blur_optimized=1
blur_params_radius = 5
blur_params_num_passes = 2
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

# Opacity & Corner Radius
border_radius=6
border_radius_location_default=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Dim Overlay
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

#######################################
# Animations
#######################################

# Enabling Animations
animations=1
layer_animations=1

# Animation Types
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

# Zoom
zoom_initial_ratio=0.4
zoom_end_ratio=0.8

# Durations
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0

# Bezier Curves
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# Tag Animation Direction
tag_animation_direction=1

#######################################
# Layouts
#######################################

# Scroller
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0

# Master-Stack
new_is_master=1
default_mfact=0.55
default_nmaster=1
center_master_overspread=0
center_when_single_stack=1

# Dwindle
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0
dwindle_smart_resize=0
dwindle_drop_simple_split=1
dwindle_manual_split=0

#######################################
# Rules
#######################################

# Window

# Tag
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Layer
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

#######################################
# Overview
#######################################

hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
hotarea_corner=2
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5
jump_labels=HJKLASDFGQWERTYUIOPZXCVBNM

#######################################
# Scratchpad
#######################################

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

#######################################
# Key Bindings
#######################################

# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,foot

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

#######################################
# Mouse & Gestures
#######################################

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
